<!doctype html><html lang="en-GB"><head>
  <meta name='impact-site-verification' value='433c0488-f7f6-4a86-9b9a-075a81062f41'><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipRank – AI tool rankings for builders</title><meta name="description" content="ShipRank ranks the best AI tools for vibe coders and builders by use case, with verified pricing and new releases."><meta property="og:title" content="ShipRank – AI tool rankings for builders"><meta property="og:description" content="The best AI tools for vibe coders, ranked by use case with verified pricing."><meta property="og:image" content="https://tobychecketts.github.io/shiprank/screenshot.png"><link rel="canonical" href="https://tobychecketts.github.io/shiprank/">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0b0d12;color:#e7e9ee}header{padding:40px 24px;background:linear-gradient(135deg,#3b2aff,#00b3a4)}h1{margin:0;font-size:2.2em}main{max-width:1150px;margin:auto;padding:24px}nav button{margin:4px;padding:8px 14px;border-radius:20px;border:1px solid #333;background:#161a22;color:#e7e9ee;cursor:pointer}nav button.on{background:#3b2aff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#161a22;border:1px solid #232835;border-radius:14px;padding:16px}.why{font-size:.85em;color:#c9b8ff;margin:6px 0}#upd{display:inline-block;margin-top:6px;padding:4px 10px;background:#0006;border-radius:8px;color:#fff}.rank{color:#00d1bd;font-weight:700}.cat{font-size:.8em;color:#9aa}a{color:#7fb2ff}small{color:#9aa}ul{padding-left:18px;margin:6px 0}</style></head><body>
<header><h1>🚢 ShipRank</h1><p>The best AI tools for vibe coders and builders, ranked by use case. <small id="upd"></small></p></header>
<main><p><a href="compare/" style="font-weight:700">⚖️ Compare tools head-to-head →</a> · <a href="guides/" style="font-weight:700">📚 Guides</a> · <a href="weekly/" style="font-weight:700">🗞️ Weekly roundup</a></p><h2>🚀 New releases</h2><div id="rel" class="grid"></div><h2>🏆 Rankings</h2><nav id="nav"></nav><div id="tools" class="grid"></div><p id=bestlinks></p></main>
<script>
fetch('tools.json').then(r=>r.json()).then(d=>{upd.textContent='Last verified: '+d.lastVerified+' (prices from official pricing pages, USD)';
rel.innerHTML=d.releases.map(r=>`<div class=card><b>${r.name}</b><br><small>${r.date}</small><p>${r.summary}</p><a href="${r.url}" target=_blank>Source</a></div>`).join('');
const cats=['All',...new Set(d.tools.map(t=>t.category))];let cur='All';
const draw=()=>{nav.innerHTML=cats.map(c=>`<button class="${c==cur?'on':''}">${c}</button>`).join('');[...nav.children].forEach((b,i)=>b.onclick=()=>{cur=cats[i];draw();bestlinks.innerHTML='Best of: '+cats.slice(1).map(c=>`<a href="best/${c.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}/">${c}</a>`).join(' · ')});
tools.innerHTML=d.tools.filter(t=>cur=='All'||t.category==cur).map(t=>`<div class=card><span class=rank>#${t.rank}</span> <a href="tools/${t.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}/" style="color:inherit"><b>${t.name}</b></a><div class=cat>${t.category}</div><p>${t.bestFor}</p><p class=why>💡 ${t.rankReason}</p><small>🆓 Free tier: ${t.freeTier}<br>💳 ${t.entryPrice}<br><a href="${t.pricingUrl}" target=_blank>Pricing</a> · checked ${t.lastChecked}</small><ul>${t.pros.map(p=>'<li>✅ '+p).join('')}${t.cons.map(p=>'<li>⚠️ '+p).join('')}</ul><a href="${t.url}" target=_blank>Official site →</a></div>`).join('')};draw();bestlinks.innerHTML='Best of: '+cats.slice(1).map(c=>`<a href="best/${c.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}/">${c}</a>`).join(' · ')});
</script></body></html>
