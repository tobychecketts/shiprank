<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipRank visit stats</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#0b0d12;color:#e7e9ee;line-height:1.5}header{padding:28px 24px;background:linear-gradient(135deg,#3b2aff,#00b3a4)}header a{color:#fff;text-decoration:none}main{max-width:900px;margin:auto;padding:24px}.card{background:#161a22;border:1px solid #232835;border-radius:14px;padding:16px;margin:12px 0}a{color:#7fb2ff}small{color:#9aa}table{border-collapse:collapse;width:100%}th,td{border:1px solid #232835;padding:8px;vertical-align:top;text-align:left;font-size:.9em}.rank{color:#00d1bd;font-weight:700}footer{max-width:900px;margin:auto;padding:24px;color:#9aa}</style></head><body><header><a href="https://tobychecketts.github.io/shiprank/"><h1 style="margin:0">🚢 ShipRank stats</h1></a><small style="color:#fff">Anonymous, cookie-free page-view counts (all-time totals since 23 Oct 2026)</small></header><main><table id=t><tr><th>Counter</th><th>Page views</th></tr></table><p><small>Counts come from Abacus (abacus.jasoncameron.dev). Viewing this page does not add a visit.</small></p></main>
